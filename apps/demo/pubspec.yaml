name: natlas_demo
description: Voice chatbot demo for the N-ATLaS Mobile SDK.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.9.0 <4.0.0"
  # 3.35+ for DropdownButtonFormField.initialValue (replaced `value`).
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  natlas_flutter:
    path: ../../packages/flutter
  # 7.x — the 5.x line resolves to record_linux 0.7.2, which does not implement
  # record_platform_interface 1.6.0 (missing startStream, wrong hasPermission
  # signature). Dart compiles every federated plugin for the kernel snapshot,
  # so that stale Linux package breaks iOS and Android builds too.
  record: ^7.1.1
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
