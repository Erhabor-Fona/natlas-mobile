name: natlas_flutter
description: >-
  Flutter SDK for N-ATLaS — Nigeria's sovereign multilingual LLM.
  Chat, streaming, voice transcription, and ready-made widgets for
  Hausa, Igbo, Yorùbá, and Nigerian English.
version: 0.1.0
homepage: https://github.com/Erhabor-Fona/natlas-mobile/tree/main/packages/flutter
repository: https://github.com/Erhabor-Fona/natlas-mobile

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# No `flutter:` section — this is a pure Dart/Flutter library with no assets,
# fonts, or plugin platform implementations.
