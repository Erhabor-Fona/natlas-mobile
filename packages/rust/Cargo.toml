[package]
name = "natlas"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Async Rust client for N-ATLaS — Nigeria's sovereign multilingual LLM (Hausa, Igbo, Yoruba, Nigerian English)"
license = "Apache-2.0"
repository = "https://github.com/Erhabor-Fona/natlas-mobile"
homepage = "https://github.com/Erhabor-Fona/natlas-mobile/tree/main/packages/rust"
documentation = "https://docs.rs/natlas"
readme = "README.md"
keywords = ["llm", "nigeria", "hausa", "yoruba", "asr"]
categories = ["api-bindings", "text-processing"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "multipart",
    "stream",
    "rustls-tls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
futures-util = "0.3"
bytes = "1.7"

[dev-dependencies]
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[features]
default = []

[package.metadata.docs.rs]
all-features = true
